[package]
name = "nv-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
nv-core = { path = "../nv-core" }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_22"] }
async-channel = "2.5.0"
chrono = "0.4.45"
anyhow = "1.0.104"
nv-sync = { path = "../nv-sync" }
serde_json = "1.0.151"

[dev-dependencies]
nv-sync = { path = "../nv-sync", features = ["test-support"] }
tempfile = "3.27.0"
log = "0.4.34"

[[bin]]
name = "nv-linux"
path = "src/main.rs"
