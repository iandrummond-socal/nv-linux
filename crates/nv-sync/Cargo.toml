[package]
name = "nv-sync"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
test-support = []

[dependencies]
nv-core = { path = "../nv-core" }
chrono = "0.4.45"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
thiserror = "2.0.21"
log = "0.4.34"
sha2 = "0.11.0"
tempfile = "3.27.0"
ureq = { version = "3.4.2", features = ["json"] }
getrandom = "0.4.3"
base64 = "0.23.1"
rustix = { version = "1.1.5", features = ["fs"] }
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
proptest = "1.11.0"
nv-sync = { path = ".", features = ["test-support"] }
